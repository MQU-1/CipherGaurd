{% extends "base.html" %}
{% block title %}Two-factor check - CipherGuard Store{% endblock %}
{% block content %}
<div class="auth-shell auth-shell-narrow">
  <div class="auth-form auth-form-center">
    <h1>Authenticator code</h1>
    <p class="auth-sub">Your password and typing rhythm matched. Enter the 6-digit code from your authenticator app to finish signing in as <strong>{{ username }}</strong>.</p>
    <form method="post" action="{{ url_for('login_2fa') }}">
      <label class="field">
        <span>6-digit code</span>
        <input type="text" name="code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required autofocus placeholder="000000">
      </label>
      <button type="submit" class="btn btn-primary btn-block">Verify and sign in</button>
    </form>
    <div class="auth-links">
      <a href="{{ url_for('login') }}">Start over</a>
    </div>
  </div>
</div>
{% endblock %}
