<aside class="drawer" id="cart-drawer" data-open="false" aria-label="Shopping bag">
  <div class="drawer__veil" data-drawer-veil></div>
  <div class="drawer__panel" role="dialog" aria-modal="true" aria-label="Shopping bag">
    <header class="drawer__head">
      <span class="eyebrow">Your bag</span>
      <button class="drawer__close" type="button" data-drawer-close aria-label="Close bag">&times;</button>
    </header>

    <div class="drawer__body" data-drawer-body></div>

    <footer class="drawer__foot" data-drawer-foot hidden>
      <div class="totals">
        <div class="totals__row"><span>Subtotal</span><span data-subtotal></span></div>
        <div class="totals__row"><span>Delivery</span><span data-shipping></span></div>
      </div>
      <p class="faint" style="font-size:12.5px" data-gap hidden></p>
      <a class="btn btn--block" href="{{ url_for('storefront.checkout') }}">Checkout</a>
      <a class="link faint" style="font-size:13px;text-align:center" href="{{ url_for('storefront.basket') }}">View full bag</a>
    </footer>
  </div>
</aside>
